plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Azure Cloud Native Order Platform - Spring Boot + REST API + Azure SQL + Service Bus'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    springdocVersion = '2.6.0'
    azureServiceBusVersion = '7.17.17'
    azureCommunicationEmailVersion = '1.1.2'
    azureCommunicationSmsVersion = '1.1.38'
}

dependencies {
    // Spring Boot Web (REST API)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Data JPA (Azure SQL Database)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // OpenAPI / Swagger UI (springdoc)
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Azure Service Bus (Topic -> Subscriptions fan-out)
    implementation "com.azure:azure-messaging-servicebus:${azureServiceBusVersion}"

    // Azure Identity (DefaultAzureCredential / Managed Identity for production)
    implementation 'com.azure:azure-identity:1.14.2'

    // Azure Communication Services (Email + SMS)
    implementation "com.azure:azure-communication-email:${azureCommunicationEmailVersion}"
    implementation "com.azure:azure-communication-sms:${azureCommunicationSmsVersion}"

    // Azure SQL JDBC driver (used by the `azure` profile / production)
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11'

    // Redis caching (cache-aside for GET /orders/{id}; Azure Cache for Redis)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // H2 (in-memory) used as the default local datasource so the app boots
    // without Docker. Azure SQL Edge is used via docker-compose + the `azure` profile.
    runtimeOnly 'com.h2database:h2'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}
